name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Build (also serves as the typecheck gate — this repo has no separate tsc/lint script)
        run: npm run build
      - name: Install test suite dependencies
        working-directory: _Test_
        run: npm install
      - name: Unit tests
        working-directory: _Test_
        run: npm run test:unit
      - name: Integration tests
        working-directory: _Test_
        run: npm run test:integration

  mcp-server-example:
    # Standalone — examples/mcp-server is deliberately outside the npm
    # workspace (packages/*) and the root build chain, since it's a template
    # for developers to copy, not a package Atlas ships. This job is what
    # keeps it from silently rotting: without it, nothing would ever build
    # or test this directory in CI.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/mcp-server/package-lock.json
      - name: Install example dependencies
        working-directory: examples/mcp-server
        run: npm install
      - name: Build
        working-directory: examples/mcp-server
        run: npm run build
      - name: Test
        working-directory: examples/mcp-server
        run: npm test

  system:
    needs: build-and-unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Build shared workspace package
        # packages/client imports @atlasagents/shared's build output; test:e2e
        # only builds packages/client itself, so this must run first.
        run: npm run build -w @atlasagents/shared
      - name: Build the example MCP server
        # examples/mcp-server is outside the root workspace (see the
        # mcp-server-example job above), so nothing else in this job builds
        # it — but _Test_/system/mcpStdioServer.e2e.test.ts and
        # mcpHttpServer.e2e.test.ts spawn examples/mcp-server/dist/*.js as a
        # real subprocess. Without this step those tests silently skip.
        working-directory: examples/mcp-server
        run: npm install && npm run build
      - name: Install test suite dependencies
        working-directory: _Test_
        run: npm install
      - name: System (E2E) tests
        # Builds packages/client itself, so system tests never silently skip in CI.
        env:
          CI: true
        working-directory: _Test_
        run: npm run test:e2e
